name: E2E Tests with Maestro

on:
  push:
    branches: [ main, master, with-tests ]
  pull_request:
    branches: [ main, master, with-tests ]
  workflow_dispatch:

jobs:
  maestro-e2e:
    name: Run Maestro E2E Tests on Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit and Widget Tests
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro E2E Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            # Garante que o ADB reconhece o dispositivo antes de prosseguir
            adb wait-for-device
            
            # Instala o APK gerado no emulador
            adb install build/app/outputs/flutter-apk/app-debug.apk
            
            # Executa a suíte de testes do Maestro
            maestro test .maestro/login_success_flow.yaml
            # maestro test .maestro/login_failure_flow.yaml

      - name: Upload Maestro Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/**/*
          if-no-files-found: ignore
